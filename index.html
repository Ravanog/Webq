<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hari×Moviez | Streaming Hub</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    /* CSS VARIABLES & CYAN / OCEAN THEMING ENGINE */
    :root {
      --bg-main: #0b1120;
      --bg-card: #151e32;
      --bg-glass: rgba(11, 17, 32, 0.85);
      --bg-glass-card: rgba(21, 30, 50, 0.65);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00f2fe, #4facfe);
      --accent-gradient-alt: linear-gradient(135deg, #38ef7d, #11998e);
      --accent-tg: linear-gradient(135deg, #0088cc, #0055a4);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
      --nav-bg: rgba(21, 30, 50, 0.85);
      --badge-bg: rgba(11, 17, 32, 0.85);
      --modal-bg: #0f172a;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    body.light-mode {
      --bg-main: #f0f4f8;
      --bg-card: #ffffff;
      --bg-glass: rgba(240, 244, 248, 0.88);
      --bg-glass-card: rgba(255, 255, 255, 0.7);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-gradient: linear-gradient(135deg, #0284c7, #0369a1);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --nav-bg: rgba(255, 255, 255, 0.88);
      --badge-bg: rgba(15, 23, 42, 0.75);
      --modal-bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 110px;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* --- HEADER SECTION --- */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b1120;
      font-size: 22px;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .logo-text {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--bg-card);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* --- CLEAN NORMAL SEARCH BAR --- */
    .search-hub {
      padding: 16px 20px 8px;
    }

    .search-bar-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 18px;
    }

    #searchInput {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.9rem;
      transition: all 0.3s ease;
      box-shadow: var(--card-shadow);
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.2);
    }

    .search-btn {
      padding: 12px 20px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--accent-gradient);
      color: #0b1120;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(0, 242, 254, 0.25);
      transition: transform 0.2s ease;
    }

    .search-btn:active {
      transform: scale(0.95);
    }

    /* --- HERO SLIDER BANNER --- */
    .banner-container {
      position: relative;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    .banner-slide {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .banner-item {
      min-width: 100%;
      height: 220px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .banner-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 10%, rgba(11,17,32,0.92) 100%);
    }

    .banner-content {
      position: relative;
      z-index: 2;
      color: #fff;
    }

    .banner-content h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .banner-content p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .banner-watch-btn {
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--accent-gradient);
      color: #0b1120;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .banner-dots {
      position: absolute;
      bottom: 12px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .banner-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
    }

    .banner-dot.active {
      width: 18px;
      border-radius: 10px;
      background: var(--accent-color);
    }

    /* --- SECTION HEADERS --- */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 10px;
    }

    .section-header h2 {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header h2::before {
      content: "";
      width: 4px;
      height: 16px;
      background: var(--accent-gradient);
      border-radius: 4px;
    }

    .more-btn {
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      color: #0b1120;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: var(--accent-gradient);
    }

    /* --- CAROUSELS & GRIDS --- */
    .movies {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 20px 10px;
      scrollbar-width: none;
    }

    .movies::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 125px;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .poster-wrapper {
      position: relative;
      width: 125px;
      height: 180px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      background: var(--bg-card);
      border: 1px solid var(--card-border);
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-quality {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--badge-bg);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .badge-rating {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: var(--badge-bg);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .badge-rating i { color: #f59e0b; }

    .title {
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .year {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* --- LANGUAGE BAR --- */
    .language-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 20px;
      scrollbar-width: none;
    }
    .language-container::-webkit-scrollbar { display: none; }

    .lang-btn {
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: var(--card-shadow);
    }

    .lang-btn:hover {
      background: var(--accent-gradient);
      color: #0b1120;
      border-color: transparent;
    }

    /* --- SEARCH RESULTS CONTAINER --- */
    #searchResultsContainer {
      display: none;
      padding: 10px 20px 20px;
    }

    .search-results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }

    /* --- MODALS & OVERLAYS --- */
    .movie-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      visibility: hidden;
      opacity: 0;
      transition: all 0.3s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
    }

    .movie-modal.show {
      visibility: visible;
      opacity: 1;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      background: var(--modal-bg);
      color: var(--text-main);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      border-top: 1px solid var(--card-border);
      overflow-y: auto;
      position: relative;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      padding-bottom: 24px;
    }

    .movie-modal.show .modal-card {
      transform: translateY(0);
    }

    .modal-header-art {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
    }

    .modal-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 18px;
    }

    .modal-info {
      padding: 16px 20px;
    }

    .modal-info h2 {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .genres span {
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .plot-text {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-muted);
      margin: 10px 0;
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 20px;
    }

    .btn-action {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #0b1120;
      box-shadow: var(--card-shadow);
      text-decoration: none;
    }

    .btn-stream { background: var(--accent-gradient); }
    .btn-telegram { background: var(--accent-tg); color: #fff; }

    /* --- BOTTOM NAVIGATION BAR --- */
    .bottomnav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 400px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 60px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 20px;
      transition: color 0.2s ease;
    }

    .menu.active-bar {
      color: var(--accent-color);
    }

    /* --- TOAST MESSAGES --- */
    .toast-message {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-gradient);
      color: #0b1120;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.8rem;
      z-index: 10000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.3s ease, fadeOut 0.3s ease 1.7s forwards;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>

  <!-- HEADER NAVIGATION -->
  <header class="header">
    <a href="#" class="brand">
      <div class="brand-icon"><i class="ri-film-fill"></i></div>
      <div class="logo-text">ʜᴀʀɪ×ᴍᴏᴠɪᴇᴢ</div>
    </a>
    <div class="header-right">
      <button class="icon-btn" id="themeToggle"><i class="ri-sun-line"></i></button>
    </div>
  </header>

  <!-- SEARCH HUB -->
  <div class="search-hub">
    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <i class="ri-search-line"></i>
        <input type="text" id="searchInput" placeholder="Search movies or genres...">
      </div>
      <button class="search-btn" id="searchBtn">
        <i class="ri-search-line"></i> Search
      </button>
    </div>
  </div>

  <!-- HOME PAGE CONTENT CONTAINER -->
  <div id="homepageContent">
    
    <!-- BANNER HERO SCROLLER -->
    <div class="banner-container">
      <div class="banner-slide" id="bannerSlide"></div>
      <div class="banner-dots" id="bannerDots"></div>
    </div>

    <!-- POPULAR MOVIES -->
    <div class="section-header">
      <h2>Popular Movies</h2>
      <button class="more-btn" data-target="popularMovies">+ More</button>
    </div>
    <div class="movies" id="popularMovies"></div>

    <!-- LANGUAGE SELECTION -->
    <div class="section-header">
      <h2>Languages</h2>
    </div>
    <div class="language-container">
      <button class="lang-btn" data-lang="hindi">Hindi</button>
      <button class="lang-btn" data-lang="english">English</button>
      <button class="lang-btn" data-lang="tamil">Tamil</button>
      <button class="lang-btn" data-lang="telugu">Telugu</button>
      <button class="lang-btn" data-lang="malayalam">Malayalam</button>
      <button class="lang-btn" data-lang="kannada">Kannada</button>
    </div>
  </div>

  <!-- SEARCH RESULTS VIEW -->
  <div id="searchResultsContainer">
    <div class="section-header" style="padding:0;">
      <h2 id="searchResultsTitle">Search Results</h2>
    </div>
    <div id="searchResultsGrid" class="search-results-grid"></div>
  </div>

  <!-- LANGUAGE FILTER MODAL -->
  <div id="languageModal" class="movie-modal">
    <div class="modal-card">
      <div class="close-modal" id="closeLangModal"><i class="ri-close-line"></i></div>
      <h2 id="langModalTitle" style="text-align:center; padding:20px 20px 10px;">Movies</h2>
      <div id="languageMoviesList" class="search-results-grid" style="padding:15px 20px;"></div>
    </div>
  </div>

  <!-- DETAIL MODAL -->
  <div id="movieModal" class="movie-modal">
    <div class="modal-card">
      <div class="modal-header-art">
        <img id="modalPoster" class="modal-poster" src="" alt="Poster">
        <div class="close-modal" id="closeModalBtn"><i class="ri-close-line"></i></div>
      </div>
      <div class="modal-info">
        <h2 id="modalTitle">Movie Title</h2>
        <div class="meta">
          <span id="modalYearText"></span>
          <span>•</span>
          <span id="modalAge">U/A</span>
          <span>•</span>
          <span>⭐ <b id="modalRating" style="color:var(--text-main);">8.5</b></span>
        </div>
        <div class="genres" id="modalGenres"></div>
        <p id="modalPlot" class="plot-text"></p>
      </div>
      
      <div class="action-btn-group">
        <button id="streamBtn" class="btn-action btn-stream"><i class="ri-play-circle-fill"></i> Stream Online</button>
        <button id="telegramBtn" class="btn-action btn-telegram"><i class="ri-telegram-fill"></i> Get Telegram Files</button>
      </div>
    </div>
  </div>

  <!-- FLOATING BOTTOM NAVIGATION BAR -->
  <nav class="bottomnav">
    <div class="menu active-bar" data-nav="home"><i class="ri-home-5-fill"></i></div>
    <div class="menu" data-nav="tv"><i class="ri-tv-2-line"></i></div>
    <div class="menu" data-nav="games"><i class="ri-gamepad-line"></i></div>
  </nav>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    let movieData = { popular: [], bannerSlides: [] };

    // Fetch JSON Database
    async function loadMovies() {
      try {
        const response = await fetch('https://profound-rubetta-mahaan-6bb914fa.koyeb.app/api/movies');
        if (!response.ok) throw new Error('Fetch failed');
        movieData = await response.json();
        renderAll();
        initBanner();
      } catch (error) {
        console.warn('Fallback JSON missing.');
      }
    }

    function renderAll() {
      renderSection('popularMovies', movieData.popular);
    }

    function renderSection(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      if (!items || items.length === 0) {
        container.innerHTML = '<div style="padding:10px;color:var(--text-muted);font-size:0.8rem">No items found</div>';
        return;
      }
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy">
            <div class="badge-quality">${item.quality || 'HD'}</div>
            <div class="badge-rating"><i class="ri-star-fill"></i> ${item.rating || 'N/A'}</div>
          </div>
          <div class="title">${item.title}</div>
          <div class="year">${item.year}</div>
        `;
        card.addEventListener('click', () => openModal(item));
        container.appendChild(card);
      });
    }

    function openModal(movie) {
      document.getElementById('modalTitle').innerText = movie.title;
      document.getElementById('modalPoster').src = movie.poster;
      document.getElementById('modalRating').innerText = movie.rating || "N/A";
      document.getElementById('modalYearText').innerText = movie.year || "";
      document.getElementById('modalAge').innerText = movie.age || "U/A";
      document.getElementById('modalPlot').innerText = movie.plot || "No description available.";
      
      const genresContainer = document.getElementById('modalGenres');
      genresContainer.innerHTML = movie.genres ? movie.genres.map(g => `<span>${g}</span>`).join('') : '';
      
      document.getElementById('streamBtn').setAttribute('data-link', movie.streamLink || '#');
      document.getElementById('telegramBtn').setAttribute('data-link', movie.telegramLink || "#");
      
      document.getElementById('movieModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('movieModal').classList.remove('show');
    }

    // Banner Scroller
    let currentIndex = 0, autoInterval;
    function initBanner() {
      const container = document.getElementById('bannerSlide');
      const dotsContainer = document.getElementById('bannerDots');
      const slides = movieData.bannerSlides;
      if (!container || !slides || slides.length === 0) return;
      
      container.innerHTML = '';
      dotsContainer.innerHTML = '';
      
      slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'banner-item';
        div.style.backgroundImage = `url('${slide.poster}')`;
        div.innerHTML = `
          <div class="banner-content">
            <h1>${slide.title}</h1>
            <p>${slide.year} • ${slide.type || 'Movie'}</p>
            <button class="banner-watch-btn"><i class="ri-play-fill"></i> Watch Now</button>
          </div>
        `;
        div.querySelector('.banner-watch-btn').addEventListener('click', () => {
          const found = (movieData.popular || []).find(m => m.title === slide.title);
          openModal(found || slide);
        });
        container.appendChild(div);

        const dot = document.createElement('div');
        dot.className = `banner-dot ${i === 0 ? 'active' : ''}`;
        dotsContainer.appendChild(dot);
      });

      function updateDots() {
        document.querySelectorAll('.banner-dot').forEach((dot, idx) => {
          dot.classList.toggle('active', idx === currentIndex);
        });
      }

      function goToSlide(index) {
        currentIndex = (index + slides.length) % slides.length;
        container.style.transform = `translateX(-${currentIndex * 100}%)`;
        updateDots();
      }

      clearInterval(autoInterval);
      autoInterval = setInterval(() => goToSlide(currentIndex + 1), 4000);
    }

    // MOVIE SEARCH SYSTEM
    function initSearch() {
      const input = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const homepage = document.getElementById('homepageContent');
      const searchContainer = document.getElementById('searchResultsContainer');
      const searchGrid = document.getElementById('searchResultsGrid');

      function performSearch() {
        const query = input.value.toLowerCase().trim();
        if(!query) {
          homepage.style.display = 'block';
          searchContainer.style.display = 'none';
          return;
        }

        homepage.style.display = 'none';
        searchContainer.style.display = 'block';
        searchGrid.innerHTML = '';

        const all = movieData.popular || [];
        const matches = all.filter(m => 
          m.title.toLowerCase().includes(query) || 
          (m.genres && m.genres.some(g => g.toLowerCase().includes(query)))
        );

        if(matches.length === 0) {
          searchGrid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1;">No movies matching your search found.</div>';
        } else {
          matches.forEach(m => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="poster-wrapper">
                <img src="${m.poster}">
              </div>
              <div class="title">${m.title}</div>
            `;
            card.addEventListener('click', () => openModal(m));
            searchGrid.appendChild(card);
          });
        }
      }

      searchBtn.addEventListener('click', performSearch);
      input.addEventListener('input', performSearch);
    }

    // Language Modal Filter
    function initLanguageFilter() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          document.getElementById('langModalTitle').innerText = `${btn.innerText} Movies`;
          
          const all = movieData.popular || [];
          const filtered = all.filter(m => {
            if(!m.language) return false;
            const langs = Array.isArray(m.language) ? m.language : [m.language];
            return langs.some(l => l.toLowerCase() === lang.toLowerCase());
          });

          const container = document.getElementById('languageMoviesList');
          container.innerHTML = '';
          if(filtered.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted);">No movies available in this language.</div>';
          } else {
            filtered.forEach(m => {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `<div class="poster-wrapper"><img src="${m.poster}"></div><div class="title">${m.title}</div>`;
              card.addEventListener('click', () => {
                document.getElementById('languageModal').classList.remove('show');
                openModal(m);
              });
              container.appendChild(card);
            });
          }
          document.getElementById('languageModal').classList.add('show');
        });
      });

      document.getElementById('closeLangModal')?.addEventListener('click', () => {
        document.getElementById('languageModal').classList.remove('show');
      });
    }

    // Theme Switcher Logic
    function initTheme() {
      const toggleBtn = document.getElementById('themeToggle');
      const icon = toggleBtn.querySelector('i');

      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        icon.className = isLight ? 'ri-moon-line' : 'ri-sun-line';
      });
    }

    // Button Actions
    function initButtons() {
      document.querySelectorAll('.more-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.getAttribute('data-target'));
          if(target) target.scrollBy({ left: 240, behavior: 'smooth' });
        });
      });

      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
      document.getElementById('movieModal').addEventListener('click', (e) => {
        if(e.target === document.getElementById('movieModal')) closeModal();
      });

      const handleLink = (id) => {
        const link = document.getElementById(id).getAttribute('data-link');
        if(link && link !== '#') window.open(link, '_blank');
        else showToast('Link not available');
      };

      document.getElementById('telegramBtn').addEventListener('click', () => handleLink('telegramBtn'));
      document.getElementById('streamBtn').addEventListener('click', () => handleLink('streamBtn'));
    }

    function initBottomNav() {
      document.querySelectorAll('.bottomnav .menu').forEach(menu => {
        menu.addEventListener('click', () => {
          if(menu.getAttribute('data-nav') !== 'home') {
            showToast('Coming Soon..!');
            return;
          }
          document.querySelectorAll('.bottomnav .menu').forEach(m => m.classList.remove('active-bar'));
          menu.classList.add('active-bar');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    // Initialize App
    loadMovies();
    initSearch();
    initLanguageFilter();
    initTheme();
    initButtons();
    initBottomNav();
  </script>
</body>
</html>
