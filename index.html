<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hari×Moviez | Stream Movies</title>
  <!-- Google Fonts & Remix Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #070a12;
      --bg-card: #121826;
      --bg-glass: rgba(11, 15, 25, 0.85);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #4f46e5, #3b82f6);
      --card-border: rgba(255, 255, 255, 0.08);
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 24px;
    }

    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --card-border: rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* --- NAVIGATION HEADER --- */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      color: #fff;
      cursor: pointer;
    }

    .brand i {
      font-size: 1.4rem;
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* --- HERO SLIDER --- */
    .hero-wrapper {
      position: relative;
      margin: 16px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .hero-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-slide {
      min-width: 100%;
      height: 230px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .hero-slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(7, 10, 18, 0.95) 15%, rgba(7, 10, 18, 0.2) 75%);
    }

    .hero-info {
      position: relative;
      z-index: 2;
    }

    .hero-info h1 {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .hero-info p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 4px 0 12px;
    }

    .btn-play {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    /* --- SECTION TITLE --- */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin: 22px 0 12px;
    }

    .section-title h2 {
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title h2::before {
      content: '';
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 4px;
    }

    /* --- LANGUAGE HERO CHIPS --- */
    .chip-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 20px 8px;
      scrollbar-width: none;
    }

    .chip-scroll::-webkit-scrollbar { display: none; }

    .lang-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 6px;
      border-radius: 40px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-chip img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255,255,255,0.2);
    }

    .lang-chip:hover, .lang-chip.active {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #fff;
    }

    .lang-chip:hover img, .lang-chip.active img {
      border-color: #fff;
    }

    /* --- UNIFORM MOVIE CARDS --- */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 14px;
      padding: 0 20px;
    }

    .media-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 20px 10px;
      scrollbar-width: none;
    }

    .media-scroll::-webkit-scrollbar { display: none; }

    .poster-card {
      flex: 0 0 115px;
      width: 115px;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .poster-card:hover {
      transform: translateY(-5px);
    }

    /* Fixed dimensions for perfectly matching card sizes */
    .poster-img-wrapper {
      position: relative;
      width: 115px;
      height: 165px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      background: var(--bg-card);
    }

    .poster-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-meta {
      margin-top: 8px;
    }

    .card-meta h4 {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .card-meta span {
      font-size: 0.72rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* --- BOTTOM DOCK NAVIGATION --- */
    .dock-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 360px;
      height: 56px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 40px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-sub);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .dock-item i { font-size: 1.25rem; }

    .dock-item.active {
      color: var(--accent);
    }

    /* --- FULLSCREEN SEARCH ENGINE OVERLAY --- */
    .search-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .search-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      font-size: 1.2rem;
      color: var(--text-sub);
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 48px;
      border-radius: 40px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    /* --- MOVIE DETAIL MODAL SHEET --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 4000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-height: 85vh;
      background: var(--bg-main);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      border-top: 1px solid var(--card-border);
      overflow-y: auto;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-header-art {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .modal-header-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-stream {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-telegram {
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header class="app-bar">
    <div class="brand" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <i class="ri-film-fill"></i>
      <span>Hari×Moviez</span>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="openSearchBtn"><i class="ri-search-line"></i></button>
      <button class="icon-btn" id="themeBtn"><i class="ri-moon-line"></i></button>
    </div>
  </header>

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-header">
      <div class="search-input-wrapper">
        <i class="ri-search-line"></i>
        <input type="text" id="engineSearchInput" placeholder="Search movies, language..." autocomplete="off">
        <button class="clear-search-btn" id="clearSearchBtn"><i class="ri-close-circle-fill"></i></button>
      </div>
      <button class="icon-btn" id="closeSearchBtn"><i class="ri-close-line"></i></button>
    </div>

    <div class="media-grid" id="searchResultsGrid"></div>
    <div id="searchNoResults" style="display:none; text-align:center; padding:50px; color:var(--text-sub);">
      <i class="ri-search-eye-line" style="font-size:3rem;"></i>
      <p style="margin-top:8px;">No movies found.</p>
    </div>
  </div>

  <!-- MAIN PAGE VIEW -->
  <main id="homeView">
    <!-- HERO CAROUSEL -->
    <div class="hero-wrapper">
      <div class="hero-track" id="heroTrack"></div>
    </div>

    <!-- POPULAR MOVIES -->
    <div class="section-title">
      <h2>Popular Movies</h2>
    </div>
    <div class="media-scroll" id="popularContainer"></div>

    <!-- LANGUAGES WITH HERO PHOTOS -->
    <div class="section-title">
      <h2>Languages</h2>
    </div>
    <div class="chip-scroll" id="languageChips">
      <div class="lang-chip active" data-lang="all">
        <i class="ri-global-line" style="margin-left: 6px;"></i> All
      </div>
      <div class="lang-chip" data-lang="hindi">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" alt="Hindi"> Hindi
      </div>
      <div class="lang-chip" data-lang="kannada">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100" alt="Kannada"> Kannada
      </div>
      <div class="lang-chip" data-lang="telugu">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100" alt="Telugu"> Telugu
      </div>
      <div class="lang-chip" data-lang="tamil">
        <img src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=100" alt="Tamil"> Tamil
      </div>
      <div class="lang-chip" data-lang="english">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="English"> English
      </div>
      <div class="lang-chip" data-lang="malayalam">
        <img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=100" alt="Malayalam"> Malayalam
      </div>
    </div>

    <!-- FILTERED MOVIES LIST GRID -->
    <div class="section-title" id="filteredTitle" style="display:none;">
      <h2 id="filteredHeading">Movies</h2>
    </div>
    <div class="media-grid" id="filteredGrid" style="display:none;"></div>
  </main>

  <!-- BOTTOM NAVIGATION DOCK -->
  <nav class="dock-nav">
    <div class="dock-item active" id="dockHome"><i class="ri-home-5-fill"></i><span>Home</span></div>
    <div class="dock-item" id="dockSearchNav"><i class="ri-search-line"></i><span>Search</span></div>
  </nav>

  <!-- MOVIE DETAILS MODAL -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-sheet">
      <div class="modal-header-art">
        <img id="modalImg" src="" alt="Poster">
        <button class="modal-close-btn" id="closeModal"><i class="ri-close-line"></i></button>
      </div>
      <h2 id="modalTitle">Movie Title</h2>
      <p id="modalMeta" style="color:var(--text-sub); font-size:0.85rem; margin-top:4px;"></p>
      <p id="modalPlot" style="margin-top:12px; font-size:0.9rem; line-height:1.5; color:var(--text-main);"></p>
      
      <div class="action-btn-group">
        <button class="btn-stream" id="streamBtn"><i class="ri-play-fill"></i> Stream Online</button>
        <button class="btn-telegram" id="telegramBtn"><i class="ri-telegram-fill"></i> Get Telegram Files</button>
      </div>
    </div>
  </div>

  <script>
    // Embedded dataset to ensure instant load without CORS errors
    const movieData = {
      bannerSlides: [
        { title: "Funky", year: "2026", type: "Romance/Comedy", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800" },
        { title: "Landlord", year: "2026", type: "Action/Drama", poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800" }
      ],
      popular: [
        { title: "Landlord", year: "2026", language: "kannada", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400", rating: "8.5", quality: "4K", plot: "A high-stakes thriller centered around power dynamics." },
        { title: "Ala Vaikunthapurramuloo", year: "2020", language: "telugu", poster: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=400", rating: "8.8", quality: "HD", plot: "A young man seeks validation from his cold father." },
        { title: "Love Insurance Kompany", year: "2026", language: "tamil", poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400", rating: "8.1", quality: "HD", plot: "A futuristic romantic comedy about securing love." },
        { title: "Max", year: "2026", language: "kannada", poster: "https://images.unsplash.com/photo-1518173946687-a4c8a383392e?w=400", rating: "8.7", quality: "4K", plot: "An action-packed journey of justice and revenge." },
        { title: "Sikandar", year: "2026", language: "hindi", poster: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=400", rating: "8.4", quality: "HD", plot: "A blockbuster action drama showcasing resilience." }
      ]
    };

    function initApp() {
      renderHero();
      renderScroll('popularContainer', movieData.popular);
    }

    function renderHero() {
      const track = document.getElementById('heroTrack');
      track.innerHTML = movieData.bannerSlides.map(slide => `
        <div class="hero-slide" style="background-image: url('${slide.poster}')">
          <div class="hero-info">
            <h1>${slide.title}</h1>
            <p>${slide.year} • ${slide.type}</p>
            <button class="btn-play" onclick="openDetails('${slide.title}')"><i class="ri-play-fill"></i> Watch Now</button>
          </div>
        </div>
      `).join('');
    }

    function renderScroll(containerId, list) {
      const el = document.getElementById(containerId);
      el.innerHTML = list.map(item => `
        <div class="poster-card" onclick='triggerModal(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
          <div class="poster-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-meta">
            <h4>${item.title}</h4>
            <span>${item.year}</span>
          </div>
        </div>
      `).join('');
    }

    // Language Filtering Logic
    document.querySelectorAll('.lang-chip').forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll('.lang-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        
        const lang = chip.getAttribute('data-lang');
        const filteredTitle = document.getElementById('filteredTitle');
        const filteredGrid = document.getElementById('filteredGrid');
        
        if (lang === 'all') {
          filteredTitle.style.display = 'none';
          filteredGrid.style.display = 'none';
          return;
        }

        const filtered = movieData.popular.filter(m => m.language === lang);
        document.getElementById('filteredHeading').innerText = `${lang.toUpperCase()} Movies`;
        filteredTitle.style.display = 'flex';
        filteredGrid.style.display = 'grid';

        if(filtered.length === 0) {
          filteredGrid.innerHTML = '<p style="color:var(--text-sub); grid-column:1/-1;">No movies found for this language.</p>';
          return;
        }

        filteredGrid.innerHTML = filtered.map(item => `
          <div class="poster-card" onclick='triggerModal(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
            <div class="poster-img-wrapper">
              <img src="${item.poster}" alt="${item.title}" loading="lazy">
            </div>
            <div class="card-meta">
              <h4>${item.title}</h4>
              <span>${item.year}</span>
            </div>
          </div>
        `).join('');
      };
    });

    // Modal Sheet Trigger
    function triggerModal(item) {
      document.getElementById('modalImg').src = item.poster;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalMeta').innerText = `${item.year || ''} • ${item.quality || 'HD'} • ⭐ ${item.rating || 'N/A'}`;
      document.getElementById('modalPlot').innerText = item.plot || 'No plot overview available.';
      document.getElementById('detailModal').classList.add('active');
    }

    function openDetails(title) {
      const match = movieData.popular.find(m => m.title === title);
      if (match) triggerModal(match);
    }

    document.getElementById('closeModal').onclick = () => document.getElementById('detailModal').classList.remove('active');

    // Theme Switcher
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.onclick = () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeBtn.innerHTML = isLight ? '<i class="ri-sun-line"></i>' : '<i class="ri-moon-line"></i>';
    };

    // Search Mechanics
    const searchOverlay = document.getElementById('searchOverlay');
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const dockSearchNav = document.getElementById('dockSearchNav');
    const engineSearchInput = document.getElementById('engineSearchInput');

    function openSearch() {
      searchOverlay.classList.add('active');
      engineSearchInput.focus();
    }

    openSearchBtn.onclick = openSearch;
    dockSearchNav.onclick = openSearch;
    closeSearchBtn.onclick = () => searchOverlay.classList.remove('active');

    engineSearchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      const grid = document.getElementById('searchResultsGrid');
      const noRes = document.getElementById('searchNoResults');

      if(!q) { grid.innerHTML = ''; noRes.style.display = 'none'; return; }

      const matches = movieData.popular.filter(m => m.title.toLowerCase().includes(q) || m.language.toLowerCase().includes(q));
      
      if(!matches.length) { grid.innerHTML = ''; noRes.style.display = 'block'; return; }

      noRes.style.display = 'none';
      grid.innerHTML = matches.map(item => `
        <div class="poster-card" onclick='triggerModal(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
          <div class="poster-img-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-meta">
            <h4>${item.title}</h4>
            <span>${item.year}</span>
          </div>
        </div>
      `).join('');
    };

    initApp();
  </script>
</body>
</html>
