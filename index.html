<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hari×Moviez</title>
  <!-- Google Fonts & Remix Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #080a0f;
      --bg-card: #121620;
      --bg-glass: rgba(8, 10, 15, 0.85);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --accent: #ef4444;
      --card-border: rgba(255, 255, 255, 0.08);
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* --- NAVIGATION BAR --- */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.25rem;
      color: #fff;
    }

    .brand i { color: var(--accent); }

    .tg-channel-btn {
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    /* --- SECTION TITLE --- */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin: 22px 0 14px;
    }

    .section-title h2 {
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- HORIZONTAL SCROLL & GRID --- */
    .media-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 0 20px 10px;
      scrollbar-width: none;
    }
    .media-scroll::-webkit-scrollbar { display: none; }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      padding: 0 20px;
    }

    /* --- MOVIE CARD DESIGN --- */
    .poster-card {
      flex: 0 0 150px;
      width: 100%;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .poster-card:hover { transform: translateY(-4px); }

    .poster-img-wrapper {
      position: relative;
      width: 100%;
      height: 225px; /* 2:3 Ratio Sizing */
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .poster-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag-quality {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .rating-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(8px);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .rating-badge i { color: #eab308; }

    .card-meta { margin-top: 10px; }

    .card-meta h4 {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .card-meta span {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* --- BOTTOM SHEET / MODAL --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 4000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-height: 85vh;
      background: var(--bg-main);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      border-top: 1px solid var(--card-border);
      overflow-y: auto;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-sheet { transform: translateY(0); }

    .modal-header-art {
      position: relative;
      width: 100%;
      height: 240px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .modal-header-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .btn-telegram {
      background: #0088cc;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 30px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="app-bar">
    <div class="brand">
      <i class="ri-film-fill"></i>
      <span>Hari×Moviez</span>
    </div>
    <!-- Replace link with your Telegram Channel -->
    <a href="https://t.me/your_channel_username" target="_blank" class="tg-channel-btn">
      <i class="ri-telegram-fill"></i> Join Channel
    </a>
  </header>

  <!-- MAIN CONTAINER -->
  <main>
    <!-- TRENDING SECTION -->
    <div class="section-title">
      <h2>🔥 Trending Now</h2>
    </div>
    <div class="media-scroll" id="trendingScroll"></div>

    <!-- ALL MOVIES SECTION -->
    <div class="section-title">
      <h2>🍿 Latest Uploads</h2>
    </div>
    <div class="media-grid" id="latestGrid"></div>
  </main>

  <!-- MOVIE DETAIL SHEET -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-sheet">
      <div class="modal-header-art">
        <img id="modalImg" src="" alt="Poster">
        <button class="modal-close-btn" id="closeModal"><i class="ri-close-line"></i></button>
      </div>
      <h2 id="modalTitle">Movie Title</h2>
      <p id="modalMeta" style="color:var(--text-sub); font-size:0.85rem; margin-top:4px;"></p>
      <p id="modalPlot" style="margin-top:12px; font-size:0.9rem; line-height:1.5; color:var(--text-main);"></p>
      
      <a href="#" id="modalTgLink" target="_blank" class="btn-telegram">
        <i class="ri-telegram-fill"></i> Open in Telegram / Get File
      </a>
    </div>
  </div>

  <script>
    /* 
      1. Add movies here or keep this array synced with a 'movies.json' file.
      2. Set 'tg_link' to your Telegram post/bot link for each specific movie.
    */
    const telegramMovies = [
      {
        title: "Rao Bahadur",
        year: "2026",
        genre: "Mystery",
        rating: "8.7",
        quality: "HD",
        poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400",
        plot: "An intricate mystery uncovering long-hidden secrets.",
        tg_link: "https://t.me/your_channel_username/101" // Telegram post link
      },
      {
        title: "Deewana",
        year: "2026",
        genre: "Comedy",
        rating: "9.2",
        quality: "4K Dolby",
        poster: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=400",
        plot: "A romantic comedy full of fun and laughter.",
        tg_link: "https://t.me/your_channel_username/102"
      },
      {
        title: "72 Hours",
        year: "2026",
        genre: "Comedy",
        rating: "7.9",
        quality: "HD",
        poster: "https://images.unsplash.com/photo-1518173946687-a4c8a383392e?w=400",
        plot: "A chaotic race against time across a wild weekend.",
        tg_link: "https://t.me/your_channel_username/103"
      },
      {
        title: "Kantara A Legend",
        year: "2025",
        genre: "Action",
        rating: "8.5",
        quality: "4K",
        poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400",
        plot: "An epic tale exploring divine roots and folklore.",
        tg_link: "https://t.me/your_channel_username/104"
      }
    ];

    // Card Builder
    function createCard(movie) {
      const tag = movie.quality ? `<div class="tag-quality">${movie.quality}</div>` : '';
      const rating = movie.rating ? `<div class="rating-badge"><i class="ri-star-fill"></i> ${movie.rating}</div>` : '';

      return `
        <div class="poster-card" onclick='openModal(${JSON.stringify(movie).replace(/'/g, "&apos;")})'>
          <div class="poster-img-wrapper">
            <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
            ${tag}
            ${rating}
          </div>
          <div class="card-meta">
            <h4>${movie.title}</h4>
            <span>${movie.year} • ${movie.genre}</span>
          </div>
        </div>
      `;
    }

    // Render Data
    function loadMovies() {
      document.getElementById('trendingScroll').innerHTML = telegramMovies.map(createCard).join('');
      document.getElementById('latestGrid').innerHTML = telegramMovies.map(createCard).join('');
    }

    // Modal Control
    function openModal(movie) {
      document.getElementById('modalImg').src = movie.poster;
      document.getElementById('modalTitle').innerText = movie.title;
      document.getElementById('modalMeta').innerText = `${movie.year} • ${movie.genre} • ⭐ ${movie.rating || 'N/A'}`;
      document.getElementById('modalPlot').innerText = movie.plot || 'Tap below to fetch files on Telegram.';
      document.getElementById('modalTgLink').href = movie.tg_link;
      
      document.getElementById('detailModal').classList.add('active');
    }

    document.getElementById('closeModal').onclick = () => {
      document.getElementById('detailModal').classList.remove('active');
    };

    loadMovies();
  </script>
</body>
</html>
